server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    # Rutas del lado del cliente (React Router): /actividad/:fecha
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ficheros estáticos con hash en el nombre: caché larga
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
